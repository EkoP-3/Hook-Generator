<title>Kanca Üretici</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Düzen: tek dar sütun; konu kutusu, altında puanlı kanca listesi. */
:root {
  --bg: #eef1f4; --panel: #ffffff; --ink: #14202b; --muted: #5a6875; --line: #d5dce3;
  --accent: #ff7a00; --good: #1f8a5b; --warn: #b7791f; --bad: #c2412d;
  --font-display: "Montserrat", "Arial Black", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --panel: #172029; --ink: #e8edf2; --muted: #93a1ae; --line: #2a3742;
    --accent: #ff8a1f; --good: #4fc28d; --warn: #e0a84a; --bad: #f07a63; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --panel: #172029; --ink: #e8edf2; --muted: #93a1ae; --line: #2a3742;
  --accent: #ff8a1f; --good: #4fc28d; --warn: #e0a84a; --bad: #f07a63; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 56px;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { max-width: 680px; margin: 0 auto; display: grid; gap: 20px; }

h1 { font: 900 clamp(28px, 5vw, 38px)/1.1 var(--font-display); margin: 0; letter-spacing: -0.01em; }
h1 span { color: var(--accent); }
.alt { margin: 6px 0 0; color: var(--muted); }

form { display: flex; flex-wrap: wrap; gap: 10px; }
#konu {
  flex: 1 1 260px; min-width: 0; padding: 13px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel); font-size: 17px;
}
.dil { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.dil button { border: 0; background: transparent; padding: 0 14px; cursor: pointer; font-weight: 700; color: var(--muted); }
.dil button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
#uret {
  border: 0; border-radius: 10px; padding: 13px 20px; cursor: pointer;
  background: var(--accent); color: #1a0d00; font-weight: 700;
}
#uret:disabled { opacity: .5; cursor: not-allowed; }
#durum { margin: 0; min-height: 1.5em; font-size: 14px; color: var(--muted); }
#durum.hata { color: var(--bad); }

ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
li {
  display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: center;
  padding: 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
}
.puan { font: 700 26px/1 var(--font-data); text-align: center; font-variant-numeric: tabular-nums; }
.puan.iyi { color: var(--good); } .puan.orta { color: var(--warn); } .puan.zayif { color: var(--bad); }
.kanca { margin: 0; font: 800 17px/1.35 var(--font-display); overflow-wrap: anywhere; }
.not { margin: 0; font-size: 13px; color: var(--muted); }
</style>

<main>
  <header>
    <h1>Kanca <span>Üretici</span></h1>
    <p class="alt">Konuyu yaz, Shorts için 5 kanca gelsin. Puan 0–100: yüksek olan ilk saniyede daha güçlü.</p>
  </header>

  <form id="form">
    <label for="konu" hidden>Konu</label>
    <input id="konu" type="text" placeholder="ör. Orka mı köpekbalığı mı?" autocomplete="off">
    <div class="dil" role="group" aria-label="Dil">
      <button type="button" data-dil="tr" aria-pressed="true">TR</button>
      <button type="button" data-dil="en" aria-pressed="false">EN</button>
    </div>
    <button id="uret" type="submit" disabled>Kanca üret</button>
  </form>
  <p id="durum" role="status"></p>

  <ol id="liste" aria-label="Kancalar"></ol>
  <p class="not" id="not"></p>
</main>

<script>
/*@@PUANLA@@*/
</script>
<script>
const FORMULLER = /*@@FORMULLER@@*/;
</script>
<script>
"use strict";
(() => {
  const $ = (id) => document.getElementById(id);
  let dil = "tr", sample = null;

  const ORNEK = { dil: "tr", konu: "Kurt mu Husky mi?", kancalar: [
    "Bu bir kurt değil. Ama genlerinde hâlâ kurt saklıyor.",
    "Kurt mu husky mi? Gözlerine bakarsan hemen anlarsın.",
    "Ormanda bunu görürsen sakın husky sanma.",
    "Bütün köpekler aslında bir kurttan geliyor. Peki husky neden hâlâ ona benziyor?",
    "Karşına bunlardan biri çıksa, hangisinden kaçardın?",
  ] };

  function ciz(set, notMetni) {
    const liste = $("liste"); liste.textContent = "";
    set.kancalar
      .map((k) => ({ k, s: Math.round(window.KancaPuan.puanla(k, set.dil).skor) }))
      .sort((a, b) => b.s - a.s)
      .forEach(({ k, s }) => {
        const li = document.createElement("li");
        const p = document.createElement("span");
        p.className = "puan " + (s >= 55 ? "iyi" : s >= 35 ? "orta" : "zayif"); p.textContent = s;
        const t = document.createElement("p"); t.className = "kanca"; t.textContent = k;
        li.append(p, t); liste.append(li);
      });
    $("not").textContent = notMetni;
  }

  // Keşif için formül kullanımı, yalnızca bu tarayıcıda
  const ANAHTAR = "kanca-formul-kullanim";
  const kullanim = () => { try { return JSON.parse(localStorage.getItem(ANAHTAR) || "{}"); } catch (e) { return {}; } };
  function kullanimEkle(kodlar) {
    try { const k = kullanim(); kodlar.forEach((x) => { k[x] = (k[x] || 0) + 1; }); localStorage.setItem(ANAHTAR, JSON.stringify(k)); } catch (e) { /* depolama kapalı */ }
  }

  function istem(konu) {
    const uygun = FORMULLER.formuller.filter((f) => f[dil]);
    const k = kullanim();
    const satir = (f) => `- ${f.kod} (${f.ad}): ${f.kalip}. Örnek: "${f[dil]}"`;
    const oncelikli = uygun.filter((f) => f.oncelik === 1).map(satir).join("\n");
    const kesif = uygun.filter((f) => f.oncelik === 2)
      .sort((a, b) => (k[a.kod] || 0) - (k[b.kod] || 0) || a.kod.localeCompare(b.kod)).slice(0, 3).map(satir).join("\n");
    const dilAdi = dil === "tr" ? "Türkçe" : "İngilizce";
    return `Hayvan Shorts videoları için kanca yaz: videonun ilk 1–3 saniyesinde söylenen cümle.

Konu: ${konu}
Dil: ${dilAdi}

KURALLAR
- Konu ilk 1–2 saniyede belli olsun; hayvan adı ilk cümlede geçsin. Selam, "bugün", "bu videoda" yok.
- Tek fikir, kısa cümle, somut isim. Zamirle başlama.
- İzleyiciye "sen" diye seslen (Türkçede sen/sence/-sın/-abilirsin; İngilizcede you/your).
- Bildiği şey ile şaşırtıcı gerçeği çarpıştır. Cevabı kancada verme ("çünkü", "yani" yok).
- Belirsiz sıfat yok (inanılmaz, muhteşem, çılgın / amazing, insane, crazy).
- Türkçede konuşma dili kullan, kitabi cümle kurma. Kanca ${dil === "tr" ? "7–16" : "9–24"} kelime.
- HİÇ sayı yazma ve "en hızlı / en büyük" gibi üstünlük iddiası kurma. Yalnızca herkesçe bilinen, kesin doğru bilgilere dayan; emin değilsen iddia yerine soru ya da karşılaştırma kur.

FORMÜLLER: 5 kanca, her biri farklı formül.
Öncelikli:
${oncelikli}
Keşif (5 kancadan tam olarak biri bunlardan birini kullansın):
${kesif}

Yalnızca şu JSON'u döndür (${dilAdi}):
{"kancalar": [{"formul": "KOD", "kanca": "..."}]}`;
  }

  document.querySelectorAll(".dil button").forEach((b) => b.addEventListener("click", () => {
    dil = b.dataset.dil;
    document.querySelectorAll(".dil button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  }));

  const HATA = {
    not_granted: "Bu sayfanın Claude'u kullanmasına izin verilmedi.",
    sampling_disabled: "Bu hesapta Claude kullanılamıyor.",
    rate_limited: "Çok sık istek gönderildi. Biraz bekleyip tekrar dene.",
    session_expired: "Oturumun kapanmış. Yeniden giriş yapıp tekrar dene.",
    refused: "Claude bu konuyu yanıtlamadı. Konuyu biraz değiştirip dene.",
  };
  const KALICI = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const konu = $("konu").value.trim();
    const durum = $("durum"); durum.classList.remove("hata");
    if (!konu) { durum.textContent = "Önce konuyu yaz."; durum.classList.add("hata"); return; }
    if (!sample) return;
    $("uret").disabled = true; durum.textContent = "Kancalar yazılıyor… (20–60 sn sürebilir)";
    try {
      const sonuc = await sample.json(istem(konu), { cache: false });
      const kancalar = (sonuc && Array.isArray(sonuc.kancalar) ? sonuc.kancalar : []).filter((x) => x && x.kanca).slice(0, 5);
      if (!kancalar.length) throw { code: "invalid_json" };
      kullanimEkle(kancalar.flatMap((x) => String(x.formul || "").toUpperCase().split("+")));
      ciz({ dil, kancalar: kancalar.map((x) => String(x.kanca)) }, "");
      durum.textContent = "";
    } catch (err) {
      const kod = err && err.code;
      if (kod === "cancelled") { durum.textContent = ""; }
      else { durum.textContent = HATA[kod] || "Bir sorun oldu, tekrar dene."; durum.classList.add("hata"); }
      if (KALICI.includes(kod)) { sample = null; return; }
    }
    $("uret").disabled = !sample;
  });

  ciz(ORNEK, "Örnek: \"Kurt mu Husky mi?\" için hazır kancalar. Kendi konunu yazınca yenileri gelir.");
  const kullan = window.claude && typeof window.claude.use === "function" ? window.claude.use("sample") : Promise.resolve(null);
  kullan.then((s) => {
    sample = s; $("uret").disabled = !s;
    if (!s) $("durum").textContent = "Bu görünümde canlı üretim kapalı; örnek gösteriliyor.";
  }).catch(() => { $("durum").textContent = "Bu görünümde canlı üretim kapalı; örnek gösteriliyor."; });
})();
</script>
